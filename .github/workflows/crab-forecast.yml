# Refreshes crab-report/data/forecast.json twice a day so Rob's Crab Report
# never has to call the weather services from a phone.
name: Crab report forecast

on:
  schedule:
    - cron: "17 12 * * *" # morning: about 4:17 am Pacific in winter, 5:17 am in summer
    - cron: "17 22 * * *" # afternoon: about 2:17 pm Pacific in winter, 3:17 pm in summer
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency: crab-forecast

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch forecast
        run: node crab-report/tools/fetch-forecast.mjs
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crab-report/data/forecast.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update crab forecast data"
          git push
          # pushes made by this workflow don't always start a Pages build, so ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
